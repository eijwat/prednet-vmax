# Ego4D video 00 (46201 frames, 160x120), as used for NIBB Open Campus 2025
# ("python3 main.py -i data_e/train_list.txt" in the legacy README).
name: ego4d
data:
  train_list: /mnt/buffalo/prednet_data/frames/ego4d_00/train_list.txt
  size: [160, 120]
  color_space: RGB
model:
  channels: [3, 48, 96, 192]
  init_weights: null
  round_mode: down_up_down
  diff_mode: pos_neg
  amp: 0.0
  omg: 1.0
train:
  bprop: 20
  period: 1000000
  save_every: 100000
  lr: 0.001
  lr_rate: 1.0
  min_lr: 0.0001
  batchsize: 1
  loss: mse
